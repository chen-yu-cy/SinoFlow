# FILE: .github/workflows/ci.yml
name: SinoFlow CI & Docker Publish

on:
  push:
    branches:
      - main
      - "feat/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-build:
    name: 1. TypeCheck, Unit Tests & Next.js Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://devuser:devpassword@localhost:5432/sinoflow_db?schema=public"
      AUTH_SECRET: "ci-test-secret-key-for-github-actions-32bytes"
      AUTH_TRUST_HOST: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Strict Type Check
        run: npx tsc --noEmit

      - name: Run Vitest Unit Test Suite (131 Tests)
        run: npm run test

      - name: Verify Next.js Production Standalone Build
        run: npm run build

  docker-publish:
    name: 2. Build & Push Docker Image to GHCR
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
