# FILE: grafana-dashboards.yml
apiVersion: 1

providers:
  - name: 'SinoFlow Monitoring'
    orgId: 1
    folder: 'SinoFlow'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
