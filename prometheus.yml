# FILE: prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "sinoflow_app"
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: "/api/health"
    params:
      format: ["prometheus"]
    static_configs:
      - targets: ["app:3000"]
